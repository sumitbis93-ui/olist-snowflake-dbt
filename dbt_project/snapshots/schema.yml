version: 2

snapshots:

  - name: snap_orders_timestamp
    description: "SCD Type 2 snapshot of Olist orders using the timestamp strategy."

    columns:
      - name: order_id
        description: "Unique identifier for the Olist order."

      - name: customer_id
        description: "Identifier of the customer associated with the order."

      - name: order_status
        description: "Current status of the order."

      - name: order_purchase_timestamp
        description: "Timestamp when the customer purchased the order."

      - name: order_approved_at
        description: "Timestamp when the payment was approved."

      - name: order_delivered_carrier_date
        description: "Date when the order was handed over to the carrier."

      - name: order_delivered_customer_date
        description: "Date when the order was delivered to the customer."

      - name: order_estimated_delivery_date
        description: "Estimated delivery date of the order."

      - name: dbt_scd_id
        description: "dbt-generated unique identifier for each snapshot version."

      - name: dbt_updated_at
        description: "Timestamp recorded by dbt when the snapshot record was updated."

      - name: dbt_valid_from
        description: "Timestamp from which this version of the record is valid."

      - name: dbt_valid_to
        description: "Timestamp until which this version of the record is valid. NULL indicates the current version."


  - name: snap_customers_check
    description: "SCD Type 2 snapshot of Olist customers using the check strategy."

    columns:
      - name: customer_id
        description: "Unique identifier for the customer record."

      - name: customer_unique_id
        description: "Identifier representing the unique customer."

      - name: customer_zip_code_prefix
        description: "First five digits of the customer's ZIP code."

      - name: customer_city
        description: "City where the customer is located."

      - name: customer_state
        description: "State where the customer is located."

      - name: dbt_scd_id
        description: "dbt-generated unique identifier for each snapshot version."

      - name: dbt_updated_at
        description: "Timestamp recorded by dbt when the snapshot record was updated."

      - name: dbt_valid_from
        description: "Timestamp from which this version of the customer record is valid."

      - name: dbt_valid_to
        description: "Timestamp until which this version of the customer record is valid. NULL indicates the current version."
