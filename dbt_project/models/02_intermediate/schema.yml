
version: 2

models:

  # ============================================================
  # INT_ORDER_ITEMS_ENRICHED
  # ============================================================

  - name: int_order_items_enriched
    description: >
      Enriched order-item level dataset combining order items with
      product, seller, customer, and product category information.
      The model represents the grain of one row per order item.

    columns:

      - name: order_id
        description: Unique identifier of the customer order.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: order_item_id
        description: Sequential item number within an order.
        data_tests:
          - not_null

      - name: product_id
        description: Identifier of the purchased product.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id

      - name: seller_id
        description: Identifier of the seller fulfilling the order item.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id

      - name: customer_id
        description: Order-level customer identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: customer_unique_id
        description: Persistent customer identifier across multiple orders.
        data_tests:
          - not_null

      - name: order_status
        description: Current status of the associated order.
        data_tests:
          - not_null

      - name: order_purchase_timestamp
        description: Timestamp when the order was placed.
        data_tests:
          - not_null

      - name: product_category_name
        description: Original Portuguese product category name.

      - name: product_category_name_english
        description: English translation of the product category.

      - name: price
        description: Price of the individual order item.
        data_tests:
          - not_null

      - name: freight_value
        description: Freight value associated with the order item.
        data_tests:
          - not_null

      - name: item_total_value
        description: Total item value calculated from price and freight.

      - name: product_weight_g
        description: Product weight in grams.

      - name: seller_city
        description: City where the seller is located.

      - name: seller_state
        description: Brazilian state where the seller is located.

      - name: customer_city
        description: City where the customer is located.

      - name: customer_state
        description: Brazilian state where the customer is located.


  # ============================================================
  # INT_ORDERS_ENRICHED
  # ============================================================

  - name: int_orders_enriched
    description: >
      Enriched order-level dataset combining orders with aggregated
      payment and customer review information. The model represents
      the grain of one row per order.

    columns:

      - name: order_id
        description: Unique identifier of the customer order.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_orders')
              field: order_id

      - name: customer_id
        description: Order-level customer identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: customer_unique_id
        description: Persistent customer identifier across multiple orders.
        data_tests:
          - not_null

      - name: order_status
        description: Current status of the order.
        data_tests:
          - not_null

      - name: order_purchase_timestamp
        description: Timestamp when the order was placed.
        data_tests:
          - not_null

      - name: order_approved_at
        description: Timestamp when the order payment was approved.

      - name: order_delivered_carrier_date
        description: Timestamp when the order was handed over to the carrier.

      - name: order_delivered_customer_date
        description: Timestamp when the order was delivered to the customer.

      - name: order_estimated_delivery_date
        description: Estimated delivery date provided to the customer.

      - name: total_payment_value
        description: Total payment amount associated with the order.

      - name: average_review_score
        description: Average customer review score associated with the order.

      - name: delivery_days
        description: Number of days between order purchase and customer delivery.

      - name: delivery_variance_days
        description: Difference between actual delivery duration and estimated delivery duration.